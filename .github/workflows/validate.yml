name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: plugin

  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch glp-card.js for shared-block sync test (#83)
        # Only the raw file is needed (byte comparison of marked blocks) --
        # no full checkout, so it can live outside github.workspace where
        # node --test's default recursive discovery would otherwise pick up
        # glp-lovelace-card's own test suite.
        # Since glp-lovelace-card#180 its root file is an esbuild bundle without
        # the GLP-SHARED markers; the blocks live in src/*.ts. Use those when
        # main has them, the root file otherwise.
        run: |
          git clone -q --depth 1 https://github.com/mxkissnr/glp-lovelace-card "${{ runner.temp }}/glp-lovelace-card-main"
          if [ -d "${{ runner.temp }}/glp-lovelace-card-main/src" ]; then
            cat "${{ runner.temp }}"/glp-lovelace-card-main/src/*.ts > "${{ runner.temp }}/glp-card.js"
          else
            cp "${{ runner.temp }}/glp-lovelace-card-main/glp-card.js" "${{ runner.temp }}/glp-card.js"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        # apt-get (triggered by --with-deps) can hang indefinitely when the
        # runner's regional Ubuntu mirror is unreachable (#111) -- a short
        # per-attempt timeout + retry lets a single mirror hiccup self-heal
        # within this run instead of needing a manual rerun.
        run: |
          for attempt in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright install attempt $attempt/3 failed or timed out, retrying..."
            sleep 10
          done
          echo "::error::Playwright Chromium install failed after 3 attempts"
          exit 1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test:coverage
        env:
          GLP_LOVELACE_CARD_PATH: ${{ runner.temp }}/glp-card.js

      - name: Build and check the committed bundle
        # glp-order-card.js is generated from src/ and committed (#143); a
        # bundle that no longer matches its source fails here.
        run: |
          npm run build
          git diff --exit-code glp-order-card.js || { echo "::error::glp-order-card.js is out of date, run npm run build and commit it"; exit 1; }
